<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phronesis | Composição de Fundos</title>
    <script>(function(){if(localStorage.getItem('phronesis-theme')==='dark')document.documentElement.classList.add('dark')})();</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{sans:['Outfit','sans-serif']},colors:{background:'#000000',surface:'rgba(255,255,255,.03)',surfaceHover:'rgba(255,255,255,.08)',neon:'#66142d',neonDim:'rgba(102,20,45,.12)'}}}};</script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/design-tokens.css') }}">
</head>
<body class="bg-white text-gray-900 dark:bg-background dark:text-white font-sans antialiased overflow-x-hidden relative min-h-screen">
    <div class="fixed top-[-10%] left-[-10%] w-[50vw] h-[50vw] rounded-full bg-neonDim blur-[120px] opacity-10 dark:opacity-30 pointer-events-none pulse-slow"></div>
    <div class="fixed bottom-[-10%] right-[-10%] w-[40vw] h-[40vw] rounded-full bg-neonDim blur-[120px] opacity-5 dark:opacity-20 pointer-events-none pulse-slower"></div>

    <main class="max-w-6xl mx-auto px-6 py-12 relative z-10">
        <header class="mb-10 flex items-center justify-between gap-4 animate-fade-in-up">
            <div class="flex items-center gap-4">
                <a href="{{ url_for('index') }}" aria-label="Voltar ao início" class="w-11 h-11 flex-shrink-0 rounded-full bg-gray-100 hover:bg-gray-200 dark:bg-white/5 dark:hover:bg-white/10 border border-gray-200 dark:border-white/10 flex items-center justify-center text-gray-600 dark:text-gray-300 transition-all magnetic-btn"><i class="ph ph-arrow-left text-xl"></i></a>
                <div>
                    <h1 class="text-3xl md:text-4xl font-bold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-gray-900 to-neon dark:from-white dark:to-neon">Composição de <span class="text-neon">Fundos</span></h1>
                    <p class="text-gray-600 dark:text-gray-400 text-sm font-light mt-1">Consulte os fundos investidos com base nas carteiras públicas da CVM</p>
                </div>
            </div>
            <button id="btn_toggle_tema" title="Alternar tema claro/escuro" class="w-11 h-11 flex-shrink-0 rounded-full bg-gray-100 hover:bg-gray-200 dark:bg-white/5 dark:hover:bg-white/10 border border-gray-200 dark:border-white/10 flex items-center justify-center text-gray-600 dark:text-gray-300 transition-all magnetic-btn"><i class="ph ph-sun text-xl block dark:hidden"></i><i class="ph ph-moon text-xl hidden dark:block"></i></button>
        </header>

        <section class="glass-panel p-6 sm:p-8 rounded-3xl relative animate-fade-in-up">
            <div class="flex items-center gap-3 mb-6">
                <div class="w-10 h-10 rounded-full bg-neon/10 flex items-center justify-center text-neon"><i class="ph ph-tree-structure text-xl"></i></div>
                <div><h2 class="text-xl font-semibold">Fundos para consultar</h2><p class="text-xs text-gray-500">Informe os fundos por CNPJ ou nome, um por linha</p></div>
            </div>
            <label for="lista_fundos_composicao" class="block text-sm font-medium text-gray-600 dark:text-gray-400 mb-2">Lista de fundos</label>
            <textarea id="lista_fundos_composicao" rows="4" class="w-full bg-gray-50 dark:bg-black/50 border border-gray-200 dark:border-white/10 rounded-xl py-3 px-4 text-gray-900 dark:text-white focus:outline-none focus:border-neon focus:ring-1 focus:ring-neon transition-all" placeholder="13.703.282/0001-35&#10;ou nome completo do fundo"></textarea>
            <div class="relative mt-4">
                <label for="busca_composicao" class="block text-sm font-medium text-gray-600 dark:text-gray-400 mb-2">Buscar no cadastro para adicionar</label>
                <input id="busca_composicao" autocomplete="off" class="w-full bg-gray-50 dark:bg-black/50 border border-gray-200 dark:border-white/10 rounded-xl py-3 pl-11 pr-4 text-gray-900 dark:text-white focus:outline-none focus:border-neon transition-all" placeholder="Digite ao menos 2 letras do nome ou CNPJ">
                <i class="ph ph-magnifying-glass absolute left-4 bottom-3.5 text-gray-400"></i>
                <ul id="sugestoes_composicao" class="absolute z-20 w-full mt-2 bg-white dark:bg-[#121212] border border-gray-200 dark:border-white/10 rounded-xl shadow-2xl max-h-60 overflow-y-auto hidden"></ul>
            </div>
            <button id="btn_buscar_composicao" class="w-full py-4 mt-6 bg-gray-900 text-white dark:bg-white dark:text-black font-semibold rounded-xl hover:bg-neon hover:text-white transition-all flex justify-center items-center gap-2"><i class="ph ph-magnifying-glass"></i><span>Buscar última composição visível</span></button>
            <p id="mensagem_composicao" role="status" class="hidden mt-4 text-sm text-red-500"></p>
        </section>

        <section id="resultado_composicao" class="hidden mt-8 animate-fade-in-up">
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-5">
                <div><h2 class="text-2xl font-semibold">Composições encontradas</h2><p class="text-sm text-gray-500">A competência exibida é a mais recente com posições individualizadas divulgadas.</p></div>
                <div class="flex gap-2">
                    <button id="btn_exportar_pdf_composicao" class="flex items-center gap-2 px-4 py-2 rounded-xl bg-neon text-white hover:opacity-90 text-sm font-medium"><i class="ph ph-file-pdf"></i> Exportar PDF</button>
                    <button id="btn_exportar_excel_composicao" class="flex items-center gap-2 px-4 py-2 rounded-xl bg-surface hover:bg-surfaceHover text-gray-900 dark:text-white border border-gray-200 dark:border-white/10 text-sm font-medium"><i class="ph ph-file-xls"></i> Exportar Excel</button>
                </div>
            </div>
            <div id="cartoes_composicao" class="space-y-6"></div>
        </section>
    </main>
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
    <script src="{{ url_for('static', filename='js/composicao.js') }}"></script>
</body>
</html>
